name: Cargo Bloat Analysis

on:
  pull_request:
  push:
    branches: [master]

jobs:
  bloat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat
      
      - name: Run cargo bloat
        id: bloat
        run: |
          # Run cargo bloat and capture output
          bloat_output=$(cargo bloat --release 2>&1)
          
          # Save full output to step output (escape for multiline)
          {
            echo 'output<<EOF'
            echo "$bloat_output"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          
          # Extract top functions (first 10 lines after header)
          top_functions=$(echo "$bloat_output" | grep -A 10 "File.*Crate.*Name" || echo "No bloat data available")
          {
            echo 'top_functions<<EOF'
            echo "$top_functions"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      
      - name: Display results
        run: |
          echo "### Cargo Bloat Analysis" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.bloat.outputs.output }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Comment on PR (optional)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### 📦 Cargo Bloat Analysis
            
            <details>
            <summary>Top Functions by Size</summary>
            
            \`\`\`
            ${{ steps.bloat.outputs.top_functions }}
            \`\`\`
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
